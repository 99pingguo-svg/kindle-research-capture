<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ログイン｜編集管理</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login-body">
<main class="login">
  <h1>編集管理</h1>
  <p class="muted">本人専用の非公開画面です。</p>
  {% if error %}<p class="flash flash-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="_prelogin" value="{{ prelogin }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>ユーザー名<input name="username" autocomplete="username" autocapitalize="off" required></label>
    <label>パスワード<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary wide">ログイン</button>
  </form>
</main>
</body>
</html>
